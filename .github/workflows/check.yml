name: governance

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install the pinned OpenSysML release
        run: |
          VER=$(python3 -c 'import yaml;print(yaml.safe_load(open("repos.yaml"))["opensysml"])')
          BASE="https://github.com/Open-MBEE/OpenSysML/releases/download/${VER}"
          curl -fsSLO "${BASE}/sysml-linux-amd64.tar.gz" && curl -fsSLO "${BASE}/SHA256SUMS.txt"
          grep ' sysml-linux-amd64.tar.gz$' SHA256SUMS.txt | sha256sum -c -
          tar xzf sysml-linux-amd64.tar.gz && install -m 755 sysml-linux-amd64 /usr/local/bin/sysml
          sysml -version | head -1
      - run: python -m pytest -q

  measure:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check out repo-registry at the pinned ref
        run: |
          read -r REG REF < <(python3 -c 'import yaml;c=yaml.safe_load(open("repos.yaml"))["registry"];print(c["repo"],c["ref"])')
          git clone --quiet "https://github.com/${REG}.git" registry
          git -C registry checkout --quiet "${REF}"
      - name: Install the pinned OpenSysML release
        run: |
          VER=$(python3 -c 'import yaml;print(yaml.safe_load(open("repos.yaml"))["opensysml"])')
          BASE="https://github.com/Open-MBEE/OpenSysML/releases/download/${VER}"
          curl -fsSLO "${BASE}/sysml-linux-amd64.tar.gz" && curl -fsSLO "${BASE}/SHA256SUMS.txt"
          grep ' sysml-linux-amd64.tar.gz$' SHA256SUMS.txt | sha256sum -c -
          tar xzf sysml-linux-amd64.tar.gz && install -m 755 sysml-linux-amd64 /usr/local/bin/sysml
          sysml -version | head -1
      - name: The committed model matches the registry pin
        run: python3 model.py --registry registry --check
      - name: Measure
        env:
          # GOVERNANCE_TOKEN: fine-grained token with Administration, Code scanning alerts and Dependabot alerts: read
          # on the measured repositories. Without it the admin-only checks report "unreadable". Pull requests run
          # whatever check.py the branch carries, so they get only the job token and skip the baseline comparison.
          GH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.GOVERNANCE_TOKEN || github.token }}
        run: |
          BASELINE=baseline.json
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then BASELINE=""; fi
          python3 check.py --registry registry --json results.json --summary summary.md --baseline "$BASELINE"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: governance-results
          path: |
            results.json
            summary.md
